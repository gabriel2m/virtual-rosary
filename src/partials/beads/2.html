<div x-data="{ index: ++count, active: false }" x-effect.current="active = current >= index"
    x-effect.active="current == index && $el.scrollIntoView({ block: 'center' })" class="size-12">
    <svg x-show="!active" @click="next()" fill="currentColor" xmlns="http://www.w3.org/2000/svg" id="mdi-record-circle-outline"
        viewBox="0 0 24 24">
        <path
            d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4M12,9A3,3 0 0,0 9,12A3,3 0 0,0 12,15A3,3 0 0,0 15,12A3,3 0 0,0 12,9Z" />
    </svg>
    <svg x-bind:class="`text-${theme.progress} drop-shadow-md/20`" x-show="active" @click="previous()" fill="currentColor"
        xmlns="http://www.w3.org/2000/svg" id="mdi-record-circle" viewBox="0 0 24 24">
        <path
            d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,9A3,3 0 0,1 15,12A3,3 0 0,1 12,15A3,3 0 0,1 9,12A3,3 0 0,1 12,9Z" />
    </svg>
</div>
